<!DOCTYPE html>
<html lang="ro">
    <head>
        <title>Ambalaje</title>
    </head>
    <body>
        <h1>Afisaj</h1>
        {% if eroare %}
            <p> {{eroare}} </p>
        {% endif %}
        <span>
            Pagina {{ pagina.number }} din {{ pagina.paginator.num_pages }}.
        </span>
        {% for prod in pagina.object_list %}
            <p>{{prod.nume}}</p>
        {% endfor %}
        {% if pagina.has_previous %}
            <a href="?pagina={{ pagina.previous_page_number }}">« Anterior</a>
        {% endif %}
        {% if pagina.has_next %}
            <a href="?pagina={{ pagina.next_page_number }}">Următor »</a>
        {% endif %}      
    </body>
</html>
